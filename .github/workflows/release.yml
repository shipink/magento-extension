name: Release zip
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match composer.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version composer.json)
          if [ "${TAG#v}" != "$version" ]; then
            echo "tag $TAG does not match composer.json version $version" >&2
            exit 1
          fi
      - run: git archive -o shipink-magento.zip HEAD -- . ':!.github' ':!tests' ':!bin'
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" shipink-magento.zip --title "$TAG" --generate-notes
